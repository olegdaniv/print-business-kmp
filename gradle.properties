#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

# Desktop release/update settings
desktopAppVersion=1.0.0
# The release workflow overrides these per build; this is the real production feed
# so local/dev builds also point at the live GitHub Pages feed instead of a stub.
desktopUpdateFeedUrl=https://olegdaniv.github.io/print-business-kmp/updates/latest.json
# Comma-separated list. Leave empty to allow only the feed host.
desktopUpdateAllowedHosts=olegdaniv.github.io
desktopAllowUpdatesWithoutChecksum=true
desktopGoogleClientId=540351279153-qfs438a1jj1pmuki3i2dmi53fo6vrpva.apps.googleusercontent.com
desktopGoogleRedirectHost=localhost
desktopGoogleRedirectPort=49932

# API base URL default. The desktop app overrides this at runtime to its
# embedded local server (see desktop Main.kt / LocalServer.kt).
printbusiness.api.host=localhost
printbusiness.api.port=8080
printbusiness.api.scheme=http
